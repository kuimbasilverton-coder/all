{% extends "main/base.html" %}

{% block content %}
<style>
  .login-container {
    max-width: 400px;
    margin: 40px auto;
    padding: 20px;
    background-color: #004080;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
  }

  .shiny-text {
    position: relative;
    display: inline-block;
    overflow: hidden;
    color: #fff;
    font-weight: bold;
  }

  .shiny-text::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.7), transparent);
    animation: shine 4s infinite;
  }

  @keyframes shine {
    0% {
      left: -50%;
    }
    100% {
      left: 100%;
    }
  }

  .login-form {
    padding: 20px;
  }

  .login-form label {
    display: block;
    margin-bottom: 10px;
    color: #fff;
  }

  .login-form input {
    width: 100%;
    height: 40px;
    margin-bottom: 20px;
    padding: 10px;
    border: none;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
  }

  .login-button {
    width: 100%;
    height: 40px;
    background-color: #fff;
    color: #004080;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
  }

  .login-button:hover {
    background-color: #ddd;
  }
</style>

<div class="login-container">
  <h2 class="shiny-text">Log in to Access results</h2>
  <form class="login-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="login-button shiny-text" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
