


{% extends 'main/base.html' %}
{% block content %}
{% load static %}

<h2 class="shiny-text"  style="text-align: center; margin-top: 20px; color: #004080;">Southlea Park Secondary</h2>

<style>
.shiny-text {
  position: relative;
  display: inline-block;
  overflow: hidden;
  color: #004080;
  font-weight: bold;
}

.shiny-text::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.9), transparent);
  animation: shine 4s infinite;
}

@keyframes shine {
  0% { left: -50%; }
  100% { left: 100%; }
}
</style>

  

{% endblock %}
