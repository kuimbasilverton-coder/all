{% extends 'main/base.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3-Step Password Gate</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #efebe4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      border-top: 3px solid white;
      max-width: 100%;
      color: white;
      font-weight: bold;
      align-items: center;
      text-align: center;
    }

    .container {
      width: 100%;
      text-align: center;
      background: #efebe4;
      padding: 30px;
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.0);
      align-items: center;
    }

    h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 30px;
    }

    .step {
      display: none;
      padding: 20px;
      background: linear-gradient(to bottom, blue, white);
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
    }

    .step.active {
      display: block;
    }

    .password-input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 2px solid #000080;
      font-size: 1em;
      margin-bottom: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .next-button {
      width: 100%;
      background: blue;
      color: white;
      font-weight: bold;
      padding: 14px;
      border-radius: 40px;
      font-size: 1.2em;
      cursor: pointer;
      border: none;
      transition: background 0.3s;
    }

    .next-button:hover {
      background: #ddd;
    }

    .error {
      color: #ffaaaa;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2></h2>
    <div id="step1" class="step active">
      <p></p>
      <input type="password" id="pass1" class="password-input" placeholder="password" />
      <div id="error1" class="error"></div>
      <button class="next-button" onclick="checkStep(1)">Next</button>
    </div>
    <div id="step2" class="step">
      <p>Enter password 2:</p>
      <input type="password" id="pass2" class="password-input" placeholder="password" />
      <div id="error2" class="error"></div>
      <button class="next-button" onclick="checkStep(2)">Next</button>
    </div>
    <div id="step3" class="step">
      <p>Enter password 3:</p>
      <input type="password" id="pass3" class="password-input" placeholder="password" />
      <div id="error3" class="error"></div>
      <button class="next-button" onclick="checkStep(3)">Next</button>
    </div>
  </div>
  <script>
    async function checkStep(step) {
      const input = document.getElementById('pass' + step);
      const errorDiv = document.getElementById('error' + step);
      const value = input.value.trim();
      if (!value) {
        errorDiv.textContent = 'Please enter a password.';
        return;
      }
      errorDiv.textContent = '';
      try {
        const response = await fetch('', { // posts to current URL
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
          },
          body: new URLSearchParams({
            password: value,
            step: step
          })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          document.getElementById('step' + step).classList.remove('active');
          if (step < 3) {
            document.getElementById('step' + (step + 1)).classList.add('active');
          } else {
            window.location.href = "/register/"; // or another target URL
          }
        } else {
          errorDiv.textContent = data.error || 'Incorrect password. Try again.';
        }
      } catch (err) {
        errorDiv.textContent = 'Server error, please try again later.';
      }
    }

    // CSRF helper to get token from cookie (Django default)
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let c of cookies) {
          let cookie = c.trim();
          if (cookie.startsWith(name + '=') ) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
  </script>
</body>
</html>
{% endblock %}
