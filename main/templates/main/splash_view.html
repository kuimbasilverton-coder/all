
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: linear-gradient(to bottom, blue, white);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash-container {
            text-align: center;
            animation: fadeIn 2s;
        }
        .logo {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px blue;
            animation: pulse 3s infinite;
            background: linear-gradient(to bottom, white, blue);
        }
        .tagline {
            color: white;
            font-size: 18px;
            margin-top: 20px;
            animation: fadeIn 4s;
            text-shadow: 0 0 10px blue;
            font-weight: bold;
            background: linear-gradient(to bottom, white, blue);
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            25% { transform: scale(1.1); opacity: 0.5; }
            50% { transform: scale(1); opacity: 0.8; }
            75% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <h1 class="logo">KAUNYE</h1>
        <p class="tagline">SEC</p>
        <p class="tagline">2026</p>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = "{% url 'login' %}";
        }, 5000);
    </script>
</body>
</html>
