
{% extends "base.html" %}

{% block title %}MathBible - Home{% endblock %}

{% block content %}
  <style>.card {
      background: #2c3e5f;
      width: 320px;
      height: 280px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.5s ease forwards;
      opacity: 0;
      margin: 40px auto;
      padding: 20px;
      box-sizing: border-box;
    }.math-img {
      width: 100px;
      height: 100px;
      background: #000;
      color: white;
      font-size: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 8px;
      margin-bottom: 20px;
      font-family: monospace;
      border-radius: 6px;
      line-height: 1.2;
      user-select: none;
    }.title {
      font-size: 28px;
      color: white;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }.open-book-btn {
      background-color: #000080;
      border-radius: 20px;
      color: orange;
      padding: 12px 36px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: none;
      font-size: 18px;
      user-select: none;
    }.open-book-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(46, 189, 159, 0.7);
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>

  <div class="card">
    <div class="math-img">
      a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup><br/>
      √3 - 5<br/>
      ∫ f(x) dx<br/>
      α + β<br/>
      x = y
    </div>
    <div class="title">MATHBIBLE</div>
    <button class="open-book-btn">OPEN BOOK</button>
  </div>
{% endblock %}
