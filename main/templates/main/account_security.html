
{% extends 'main/base.html' %}
{% block title %}Account Security{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; color: black;">
  <h2 style="letter-spacing: 3px; margin-bottom: 20px; color: orange;"></h2>

  {% if messages %}
    <ul style="list-style:none; padding:0;">
      {% for message in messages %}
        <li style="padding: 8px; margin-bottom: 10px; border-radius: 5px;
          background: {% if message.tags == 'error' %}#ff4f4f{% else %}#4caf50{% endif %};">
          {{ message }}
        </li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post" action="{% url 'account_security' %}">
    {% csrf_token %}

    <label for="school_code" style="font-weight: bold;">SCHOOL CODE</label><br>
    <input type="text" id="school_code" name="school_code" required
      style="width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">

    <label for="password" style="font-weight: bold;">PASSWORD</label><br>
    <input type="password" id="password" name="password" required
      style="width: 100%; padding: 10px; margin: 8px 0 24px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">

    <label for="new_code" style="font-weight: bold;">NewCode</label><br>
    <input type="text" id="new_code" name="new_code"
      style="width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">

    <label for="new_password" style="font-weight: bold;">NewPassword</label><br>
    <input type="password" id="new_password" name="new_password"
      style="width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">

    <label for="confirm_password" style="font-weight: bold;">ConfirmPassword</label><br>
    <input type="password" id="confirm_password" name="confirm_password"
      style="width: 100%; padding: 10px; margin: 8px 0 24px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">

    <button type="submit" style="width: 100%; background: black; color: white; padding: 14px; font-weight: bold; border-radius: 40px; font-size: 1.2em; cursor: pointer;">
      DONE
    </button>
  </form>
</div>
{% endblock %}
