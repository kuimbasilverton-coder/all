<div style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; color: black;">
  
  
  <form method="post" action="{% url 'register' %}">
    {% csrf_token %}
    <label for="school_name" style="font-weight: bold;">School Name</label><br>
    <input type="text" id="school_name" name="school_name" required 
      style="width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">
    
    <label for="school_code" style="font-weight: bold;">School Code</label><br>
    <input type="text" id="school_code" name="school_code" required 
      style="width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">
    
    <label for="password" style="font-weight: bold;">Password</label><br>
    <input type="password" id="password" name="password" required 
      style="width: 100%; padding: 10px; margin: 8px 0 24px 0; border-radius: 8px; border: 2px solid #000080; font-size: 1em;">
      
    <button type="submit" style="width: 100%; background: cyan; color: black; padding: 14px; font-weight: bold; border-radius: 40px; font-size: 1.2em; cursor: pointer;">
      Register
    </button>
  </form>

  
</div>
