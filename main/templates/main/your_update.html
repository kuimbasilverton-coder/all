
{% extends "main/base.html" %}

{% block content %}
  <h1 style="color: orange; font-weight: bold; margin-bottom: 20px;">SEND MARKS</h1>

  <form method="post" style="max-width: 900px; margin:auto; background:#27719f; padding: 20px; border-radius: 8px; color: white;">
    {% csrf_token %}

    <table style="width:100%; border-collapse: collapse; text-align: center;">
      <tr>
        {% for i in numbers %}
          <td><input name="tudent_name_{{ i }}" placeholder="Name" required style="width: 90%; padding: 5px; border-radius: 4px;"></td>
        {% endfor %}
      </tr>
      <tr>
        {% for i in numbers %}
          <td><input type="number" name="tudent_mark_{{ i }}" placeholder="%" min="0" max="100" required style="width: 90%; padding: 5px; border-radius: 4px;"></td>
        {% endfor %}
      </tr>
    </table>

    <div style="margin-top: 20px; text-align: center;">
      <button type="submit" style="background: orange; border: none; padding: 10px 40px; border-radius: 5px; font-weight: bold; cursor: pointer;">Submit</button>
    </div>
  </form>
{% endblock %}
