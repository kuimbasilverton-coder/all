<!DOCTYPE html>

<title>Subjects & Forms</title>
<style>.collapsible {
    background-color: #004080;
    color: white;
    cursor: pointer;
    padding: 10px;
    width: 100%;
    text-align: left;
    border: none;
    outline: none;
    font-size: 16px;
  }.active,.collapsible:hover { background-color: #0056b3; }.content {
    padding: 0 15px; display: none; overflow: hidden; background-color: #f1f1f1;
  }
  button {
    margin: 5px 0;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    background-color: #28a745;
    color: white;
    cursor: pointer;
  }
  button:hover { background-color: #218838; }
</style>
</head>

<script>
function toggleContent(id) {
  var content = document.getElementById(id);
  if (content.style.display === "block") {
    content.style.display = "none";
  } else {
    content.style.display = "block";
  }
}
</script>
